<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DT NEXUS - Comunicação Interna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .chat-container { max-width: 800px; margin: 50px auto; background: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .chat-header { background: #21262d; padding: 20px; border-bottom: 1px solid #30363d; font-weight: bold; color: #58a6ff; }
        .chat-messages { height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #21262d; padding: 12px 16px; border-radius: 8px; max-width: 70%; border-left: 4px solid #58a6ff; word-break: break-word; }
        .message.self { background: #1f6feb22; border-left-color: #238636; align-self: flex-end; }
        .chat-input-area { padding: 20px; background: #21262d; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        .form-control, .btn { background-color: #0d1117; border-color: #30363d; color: #c9d1d9; }
        .form-control:focus { background-color: #0d1117; color: #c9d1d9; border-color: #58a6ff; box-shadow: none; }
        .btn-primary { background-color: #238636; border-color: #238636; }
        .btn-primary:hover { background-color: #2ea043; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">💬 DT NEXUS - Chat Interno da Equipe</div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="sender" class="form-control" placeholder="Seu Nome" style="max-width: 150px;" value="Daniel">
            <input type="text" id="messageInput" class="form-control" placeholder="Digite sua mensagem..." autofocus>
            <button onclick="sendMessage()" class="btn btn-primary">Enviar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        let stompClient = null;

        function connect() {
            let socket = new SockJS('/ws-chat');
            stompClient = Stomp.over(socket);
            // Desativa os logs repetitivos do STOMP no console se desejar: stompClient.debug = null;
            stompClient.connect({}, function (frame) {
                stompClient.subscribe('/topic/public', function (messageOutput) {
                    showMessage(JSON.parse(messageOutput.body));
                });
            }, function(error) {
                console.error('Erro na conexão STOMP:', error);
                setTimeout(connect, 5000); // Tentativa simples de reconexão automática
            });
        }

        function sendMessage() {
            let sender = document.getElementById('sender').value;
            let content = document.getElementById('messageInput').value;
            if(content.trim() === '' || !stompClient || !stompClient.connected) return;

            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify({
                'sender': sender,
                'content': content,
                'timestamp': new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }));
            document.getElementById('messageInput').value = '';
            document.getElementById('messageInput').focus();
        }

        function showMessage(message) {
            let chatMessages = document.getElementById('chat-messages');
            let messageElement = document.createElement('div');
            let currentSender = document.getElementById('sender').value;
            
            messageElement.classList.add('message');
            if(message.sender === currentSender) {
                messageElement.classList.add('self');
            }

            messageElement.innerHTML = `<strong>${escapeHtml(message.sender)}</strong> <small class="text-muted">${message.timestamp || ''}</small><br>${escapeHtml(message.content)}`;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Função auxiliar simples para prevenir XSS básico no client-side
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;")
                       .replace(/"/g, "&quot;")
                       .replace(/'/g, "&#039;");
        }

        // Enviar mensagem com a tecla Enter
        document.getElementById('messageInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.onload = connect;
    </script>
</body>
</html>
