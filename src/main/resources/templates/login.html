<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Acesso seguro ao DT Nexus CRM para Auto Centers">
    <title>Entrar | DT NEXUS CRM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            prefix: 'tw-',
            corePlugins: { preflight: false }
        };
    </script>

    <style>
        :root[data-theme="light"] {
            --neon-blue: #0284c7;
            --neon-soft: rgba(2, 132, 199, 0.18);
            --bg-body: #eef5f9;
            --bg-card: rgba(255, 255, 255, 0.72);
            --bg-input: rgba(255, 255, 255, 0.68);
            --border-color: rgba(2, 132, 199, 0.24);
            --text-main: #102a43;
            --text-secondary: #627d98;
            --muted-border: rgba(16, 42, 67, 0.13);
            --shadow: 0 24px 70px rgba(16, 42, 67, 0.15);
            --ambient-one: rgba(2, 132, 199, 0.14);
            --ambient-two: rgba(14, 165, 233, 0.1);
        }

        :root[data-theme="dark"] {
            --neon-blue: #38bdf8;
            --neon-soft: rgba(56, 189, 248, 0.16);
            --bg-body: #07121d;
            --bg-card: rgba(12, 28, 43, 0.72);
            --bg-input: rgba(8, 22, 35, 0.7);
            --border-color: rgba(56, 189, 248, 0.28);
            --text-main: #f1f7fb;
            --text-secondary: #9fb3c8;
            --muted-border: rgba(241, 247, 251, 0.14);
            --shadow: 0 24px 90px rgba(0, 0, 0, 0.42);
            --ambient-one: rgba(14, 116, 144, 0.2);
            --ambient-two: rgba(2, 132, 199, 0.13);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            color: var(--text-main);
            background:
                radial-gradient(circle at 12% 18%, var(--ambient-one), transparent 29%),
                radial-gradient(circle at 88% 84%, var(--ambient-two), transparent 32%),
                var(--bg-body);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.35s ease, color 0.35s ease, opacity 0.35s ease;
        }

        body.is-leaving { opacity: 0; }

        .login-shell {
            position: relative;
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 32px 18px;
            isolation: isolate;
        }

        .geometry {
            position: absolute;
            z-index: -1;
            border: 1px solid var(--border-color);
            background: linear-gradient(135deg, var(--ambient-one), transparent);
            opacity: 0.55;
            transform: rotate(26deg);
            pointer-events: none;
        }

        .geometry-one {
            top: 10%;
            left: -82px;
            width: 230px;
            height: 230px;
            border-radius: 28px;
        }

        .geometry-two {
            right: -105px;
            bottom: 8%;
            width: 290px;
            height: 150px;
            border-radius: 50%;
            transform: rotate(-24deg);
        }

        .login-card {
            width: min(100%, 432px);
            padding: clamp(28px, 5vw, 46px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            background: var(--bg-card);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: card-enter 0.65s ease both;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 13px;
            color: #fff;
            background: var(--neon-blue);
            box-shadow: 0 8px 24px var(--neon-soft);
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .brand-name {
            margin: 0;
            color: var(--text-main);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.05rem, 4vw, 1.3rem);
            font-weight: 800;
            letter-spacing: 0;
        }

        .brand-name span { color: var(--neon-blue); }

        .eyebrow {
            margin: 0 0 9px;
            color: var(--neon-blue);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .login-title {
            margin: 30px 0 8px;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1.65rem, 6vw, 2rem);
            font-weight: 700;
            letter-spacing: 0;
        }

        .login-subtitle {
            margin: 0 0 28px;
            color: var(--text-secondary);
            font-size: 0.91rem;
            line-height: 1.6;
        }

        .field-group { margin-bottom: 17px; }

        .field-label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-secondary);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            z-index: 1;
            color: var(--text-secondary);
            font-size: 1rem;
            pointer-events: none;
            transform: translateY(-50%);
        }

        .field-input {
            width: 100%;
            min-height: 51px;
            padding: 13px 46px 13px 44px;
            border: 1px solid var(--muted-border);
            border-radius: 11px;
            outline: none;
            color: var(--text-main);
            background: var(--bg-input);
            font: inherit;
            font-size: 0.92rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .field-input::placeholder { color: var(--text-secondary); opacity: 0.78; }
        .field-input:focus {
            border-color: var(--neon-blue);
            background: var(--bg-card);
            box-shadow: 0 0 0 4px var(--neon-soft);
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            display: grid;
            width: 31px;
            height: 31px;
            place-items: center;
            border: 0;
            border-radius: 8px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .password-toggle:hover, .password-toggle:focus-visible { color: var(--neon-blue); background: var(--neon-soft); }

        .submit-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            min-height: 52px;
            margin-top: 9px;
            border: 1px solid var(--neon-blue);
            border-radius: 11px;
            color: #fff;
            background: var(--neon-blue);
            box-shadow: 0 10px 22px var(--neon-soft);
            cursor: pointer;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .submit-button:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 13px 28px var(--neon-soft); }
        .submit-button:disabled { cursor: wait; opacity: 0.82; transform: none; }

        .button-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.42);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .submit-button.is-loading .button-spinner { display: inline-block; }
        .submit-button.is-loading .button-label { opacity: 0.78; }

        .form-message {
            min-height: 22px;
            margin: 14px 0 0;
            color: #dc3545;
            font-size: 0.82rem;
            text-align: center;
        }

        .login-footer {
            margin: 26px 0 0;
            padding-top: 18px;
            border-top: 1px solid var(--muted-border);
            color: var(--text-secondary);
            font-size: 0.74rem;
            line-height: 1.55;
            text-align: center;
        }

        .login-footer i { margin-right: 4px; color: var(--neon-blue); }

        .theme-button {
            position: fixed;
            top: 20px;
            right: 20px;
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            background: var(--bg-card);
            cursor: pointer;
            font-size: 1rem;
            backdrop-filter: blur(8px);
        }

        .theme-button:hover { color: var(--neon-blue); }

        @keyframes card-enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 520px) {
            .login-shell { padding: 24px 15px; }
            .login-card { padding: 29px 22px; border-radius: 18px; }
            .geometry-one { left: -150px; }
            .geometry-two { right: -165px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>

<body>
    <button class="theme-button" id="themeToggle" type="button" aria-label="Alternar tema" title="Alternar tema">
        <i class="bi bi-moon-stars" aria-hidden="true"></i>
    </button>

    <main class="login-shell">
        <span class="geometry geometry-one" aria-hidden="true"></span>
        <span class="geometry geometry-two" aria-hidden="true"></span>

        <section class="login-card" aria-labelledby="loginTitle">
            <div class="brand-mark" aria-hidden="true">DT</div>
            <p class="eyebrow">Gestao inteligente para Auto Centers</p>
            <p class="brand-name">DT NEXUS <span>CRM</span></p>

            <h1 class="login-title" id="loginTitle">Acesse seu painel</h1>
            <p class="login-subtitle">Entre para acompanhar sua operacao, clientes e oportunidades em um so lugar.</p>

            <form id="loginForm" novalidate>
                <div class="field-group">
                    <label class="field-label" for="tenant">ID do Auto Center</label>
                    <div class="input-wrap">
                        <i class="bi bi-building input-icon" aria-hidden="true"></i>
                        <input class="field-input" id="tenant" name="tenant" type="text" autocomplete="organization" placeholder="Manaus Auto Center" required>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label" for="username">Usuario / E-mail</label>
                    <div class="input-wrap">
                        <i class="bi bi-person input-icon" aria-hidden="true"></i>
                        <input class="field-input" id="username" name="username" type="email" autocomplete="username" placeholder="gerente@autocenter.com" required>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label" for="password">Senha secreta</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock input-icon" aria-hidden="true"></i>
                        <input class="field-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
                        <button class="password-toggle" id="passwordToggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button class="submit-button" id="submitButton" type="submit">
                    <span class="button-spinner" aria-hidden="true"></span>
                    <span class="button-label">Entrar no painel</span>
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
                <p class="form-message" id="formMessage" role="alert" aria-live="polite"></p>
            </form>

            <p class="login-footer"><i class="bi bi-shield-check" aria-hidden="true"></i> Ambiente protegido para a sua operacao.</p>
        </section>
    </main>

    <script>
        (() => {
            const root = document.documentElement;
            const form = document.getElementById('loginForm');
            const password = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = themeToggle.querySelector('i');
            const submitButton = document.getElementById('submitButton');
            const formMessage = document.getElementById('formMessage');

            const setTheme = (theme) => {
                root.setAttribute('data-theme', theme);
                localStorage.setItem('dt_nexus_theme', theme);
                themeIcon.className = theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
                themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Usar tema claro' : 'Usar tema escuro');
            };

            setTheme(localStorage.getItem('dt_nexus_theme') || 'light');

            themeToggle.addEventListener('click', () => {
                setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            });

            passwordToggle.addEventListener('click', () => {
                const isPassword = password.type === 'password';
                password.type = isPassword ? 'text' : 'password';
                passwordToggle.setAttribute('aria-pressed', String(isPassword));
                passwordToggle.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
                passwordToggle.querySelector('i').className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            });

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                formMessage.textContent = '';

                if (!form.checkValidity()) {
                    formMessage.textContent = 'Preencha os três campos para continuar.';
                    form.reportValidity();
                    return;
                }

                const payload = {
                    tenant: document.getElementById('tenant').value.trim(),
                    username: document.getElementById('username').value.trim(),
                    password: password.value
                };

                submitButton.disabled = true;
                submitButton.classList.add('is-loading');

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('Login indisponivel');
                    const result = await response.json();
                    localStorage.setItem('accessToken', result.accessToken);
                    localStorage.setItem('tenant', payload.tenant);
                    localStorage.setItem('trialDaysRemaining', String(result.trialDaysRemaining ?? 0));
                    localStorage.setItem('accountStatus', result.accountStatus || 'TRIAL_ATIVO');
                    document.body.classList.add('is-leaving');
                    setTimeout(() => { window.location.assign('/'); }, 280);
                } catch (error) {
                    formMessage.textContent = 'Não foi possível autenticar. Verifique seus dados e tente novamente.';
                    submitButton.disabled = false;
                    submitButton.classList.remove('is-loading');
                }
            });
        })();
    </script>
</body>

</html>
